---
- name: Install required package
  ansible.builtin.package:
    name: cifs-utils
    state: present
  become: true

- name: Configure NetworkManager to wait for connection
  ansible.builtin.systemd:
    name: NetworkManager-wait-online
    enabled: true
  become: true

- name: Put cifspw file in place
  ansible.builtin.template:
    src: cifspw.jinja2
    dest: /etc/cifspw
    owner: "{{ nas_mounts_os_user }}"
    group: root
    mode: "0600"
  become: true

- name: Ensure cifs mounts
  ansible.posix.mount:
    path: "{{ item.dest }}"
    src: "{{ item.src }}"
    fstype: cifs
    opts: >-
      {{ (_nas_mounts_base_opts + (_nas_mounts_gvfs_opts if _nas_mounts_gvfs_show | bool else [])) | join(',') }}
    state: mounted
  loop: "{{ nas_mounts_cifs_mounts }}"
  loop_control:
    label: "{{ item.dest }}"
  vars:
    _nas_mounts_gvfs_show: "{{ item.gvfs_show | default(nas_mounts_gvfs_show) }}"
    _nas_mounts_gvfs_name: "{{ item.name | default(item.dest | basename, true) }}"
    _nas_mounts_base_opts:
      - auto
      - users
      - _netdev
      - "uid={{ nas_mounts_os_user }}"
      - "gid={{ nas_mounts_os_user }}"
      - credentials=/etc/cifspw
      - vers=3
    _nas_mounts_gvfs_opts:
      - x-gvfs-show
      - "x-gvfs-name={{ _nas_mounts_gvfs_name | urlencode }}"
  become: true
